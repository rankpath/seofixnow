<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | SEOFixNow</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="https://rankpath.github.io/seofixnow/favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 1rem 2.5rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>404 - Page Not Found</h1>
        <p>Sorry, we couldn't find that page.</p>
        <!-- Absolute link: this page is served for any missing path, so relative links would break. -->
        <a href="https://rankpath.github.io/seofixnow/" class="cta-button">Back to SEOFixNow</a>
    </main>
</body>
</html>
